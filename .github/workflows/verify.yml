name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install numpy

      - name: Download verification ELFs
        run: |
          gh release download pireus-elfs-v1 --repo Sounio-lang/pireus --dir /tmp/pireus-elfs
          chmod +x /tmp/pireus-elfs/*.elf
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set Lean toolchain
        run: elan default leanprover/lean4:v4.33.0

      - name: Cache Lean build
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/lean4/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean4/lean-toolchain', 'formal/lean4/lakefile.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-

      - name: Verify (Python + ELFs + Lean)
        working-directory: continuity
        run: |
          python3 verify_all.py \
            --admission-bin /tmp/pireus-elfs/admission.elf \
            --novelty-bin /tmp/pireus-elfs/novelty.elf \
            --group-bin /tmp/pireus-elfs/group_variance.elf \
            --lean-dir ../formal/lean4
