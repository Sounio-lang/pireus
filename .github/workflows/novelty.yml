name: novelty

on:
  push:
  pull_request:

jobs:
  reward-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reward map without the native oracle
        working-directory: continuity
        run: python3 test_grpo_novelty.py
